# Configuration Supabase CLI (npx supabase ...). Voir README.
project_id = "houcine-chapati"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
# Ajoutez ici vos domaines de production, ex. "https://commande.votre-domaine.dz"
additional_redirect_urls = ["http://localhost:5174", "http://localhost:5175"]
enable_signup = true
# Les clients commandent sans compte : l'app crée une session invité
# (anonyme) au moment de la première commande, pour que la RLS ne montre à
# chaque téléphone que ses propres commandes. Doit rester activé.
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Connexion des clients. Client ID/Secret à créer dans Google Cloud Console
# (voir README § Connexion Google), puis à renseigner soit ici via des
# variables d'environnement (CLI / self-hosted), soit directement dans
# Supabase → Authentication → Sign In / Providers → Google (projet hébergé).
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

# Ces fonctions vérifient elles-mêmes le jeton de l'appelant
# (obligatoire avec les nouvelles clés publishable/secret).
[functions.manage-drivers]
verify_jwt = false

[functions.dispatch-notification]
verify_jwt = false
